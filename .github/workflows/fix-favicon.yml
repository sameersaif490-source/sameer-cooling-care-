name: Fix missing favicon

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add favicon safely
        run: |
          cat > favicon.svg <<'EOF'
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
            <rect width="64" height="64" rx="14" fill="#06265f"/>
            <path d="M32 8 35.8 21.2 49 25 35.8 28.8 32 42l-3.8-13.2L15 25l13.2-3.8L32 8Z" fill="#fff"/>
            <circle cx="45" cy="45" r="8" fill="#16b957"/>
          </svg>
          EOF
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          if 'rel="icon"' not in s:
              s = s.replace('<link rel="canonical" href="https://sameersaif490-source.github.io/sameer-cooling-care-/">', '<link rel="canonical" href="https://sameersaif490-source.github.io/sameer-cooling-care-/"><link rel="icon" href="favicon.svg" type="image/svg+xml">', 1)
              p.write_text(s, encoding='utf-8')
          PY
          rm -f .github/workflows/fix-favicon.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html favicon.svg .github/workflows/fix-favicon.yml
          git diff --cached --quiet && exit 0
          git commit -m "Add site favicon"
          git push
