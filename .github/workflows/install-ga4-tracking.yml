name: Install GA4 Tracking

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Add Google Analytics tracking
        shell: python
        run: |
          from pathlib import Path

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          marker = 'data-ga4-installed="G-DG600WVK24"'
          if marker not in s:
              head = '''\n<!-- Google tag (gtag.js) -->\n<script async src="https://www.googletagmanager.com/gtag/js?id=G-DG600WVK24"></script>\n<script>\n  window.dataLayer = window.dataLayer || [];\n  function gtag(){dataLayer.push(arguments);}\n  gtag('js', new Date());\n  gtag('config', 'G-DG600WVK24');\n</script>\n'''
              tracking = '''\n<script data-ga4-installed="G-DG600WVK24">\n(function(){\n  document.addEventListener('click', function(e){\n    var a = e.target.closest('a');\n    if (!a || typeof gtag !== 'function') return;\n    var href = a.getAttribute('href') || '';\n    if (href.indexOf('tel:') === 0) {\n      gtag('event', 'phone_call_click', {event_category:'engagement', event_label:href.replace('tel:','')});\n    } else if (href.indexOf('wa.me/') !== -1 || href.indexOf('whatsapp') !== -1) {\n      gtag('event', 'whatsapp_click', {event_category:'engagement', event_label:href});\n    }\n  });\n})();\n</script>\n'''
              s = s.replace('<head>', '<head>' + head, 1)
              s = s.replace('</body>', tracking + '</body>', 1)
              p.write_text(s, encoding='utf-8')
          else:
              print('GA4 tracking already installed')

      - name: Commit tracking changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Install GA4 tracking and call WhatsApp events"
            git push
          fi
