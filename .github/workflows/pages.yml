name: Deploy website to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Optimize embedded gallery images
        run: |
          python3 - <<'PY'
          import base64
          import hashlib
          import re
          from pathlib import Path

          path = Path("index.html")
          html = path.read_text(encoding="utf-8")
          out = Path("images")
          out.mkdir(exist_ok=True)
          seen = {}

          pattern = re.compile(r'data:image/(jpeg|jpg|png|webp);base64,([A-Za-z0-9+/=]+)')

          def replace(match):
              ext, encoded = match.groups()
              raw = base64.b64decode(encoded)
              digest = hashlib.sha256(raw).hexdigest()[:16]
              if digest not in seen:
                  suffix = "jpg" if ext in ("jpeg", "jpg") else ext
                  filename = f"gallery-{len(seen)+1}.{suffix}"
                  (out / filename).write_bytes(raw)
                  seen[digest] = filename
              return seen[digest]

          html = pattern.sub(replace, html)
          html = re.sub(r'<img(?![^>]*\bloading=)([^>]*?)>', r'<img\1 loading="lazy" decoding="async">', html, flags=re.I)
          path.write_text(html, encoding="utf-8")
          print(f"Extracted {len(seen)} unique embedded images; HTML size is now {path.stat().st_size} bytes")
          PY

      - name: Apply SEO metadata
        run: |
          python3 - <<'PY'
          import json
          import re
          from pathlib import Path

          path = Path("index.html")
          html = path.read_text(encoding="utf-8")
          site = "https://sameersaif490-source.github.io/sameer-cooling-care-/"
          title = "Sameer Cooling Care | AC Repair in Delhi | Fridge & Washing Machine Service"
          description = "AC repair and service in Delhi, AC gas filling, cooling coil replacement, fridge repair and washing machine service. Sameer Cooling Care serves Delhi and nearby areas."

          html = re.sub(r'<title>.*?</title>', f'<title>{title}</title>', html, count=1, flags=re.I|re.S)
          html = re.sub(r'<meta\s+name=["\']description["\'][^>]*>', '', html, flags=re.I)
          html = re.sub(r'<head>', '<head>\n<meta name="description" content="' + description + '">\n<meta name="robots" content="index,follow,max-image-preview:large">\n<link rel="canonical" href="' + site + '">\n<meta property="og:title" content="' + title + '">\n<meta property="og:description" content="' + description + '">\n<meta property="og:url" content="' + site + '">\n<meta property="og:type" content="website">', html, count=1, flags=re.I)

          schema = {
              "@context": "https://schema.org",
              "@type": "LocalBusiness",
              "name": "Sameer Cooling Care",
              "url": site,
              "areaServed": [
                  {"@type": "City", "name": "Delhi"},
                  {"@type": "City", "name": "Ghaziabad"},
                  {"@type": "City", "name": "Noida"}
              ],
              "serviceType": [
                  "AC Repair", "AC Service", "AC Gas Filling", "Cooling Coil Replacement", "Fridge Repair", "Washing Machine Repair"
              ]
          }
          block = '<script type="application/ld+json">' + json.dumps(schema, ensure_ascii=False, separators=(",", ":")) + '</script>'
          html = re.sub(r'</head>', block + '\n</head>', html, count=1, flags=re.I)
          path.write_text(html, encoding="utf-8")
          PY

      - name: Add Delhi local SEO service content
        run: |
          python3 - <<'PY'
          import re
          import json
          from pathlib import Path

          path = Path("index.html")
          html = path.read_text(encoding="utf-8")

          css = r'''
          .localSeo{background:#fff}.localSeoGrid{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;margin-bottom:30px}.localSeoCard{border:1px solid #e5ebf3;border-radius:18px;padding:24px;background:#fff}.localSeoCard h3{margin:0 0 9px;font-size:20px}.localSeoCard p{margin:0;color:#667085;line-height:1.65}.faqGrid{display:grid;grid-template-columns:1fr 1fr;gap:16px}.faq{border:1px solid #e5ebf3;border-radius:15px;padding:20px;background:#f8fbff}.faq h3{font-size:17px;margin:0 0 8px}.faq p{margin:0;color:#667085;line-height:1.6}.localCta{margin-top:28px;padding:24px;border-radius:18px;background:#061a40;color:#fff;display:flex;align-items:center;justify-content:space-between;gap:18px}.localCta p{margin:5px 0 0;color:#d8e7f8}@media(max-width:800px){.localSeo{padding-bottom:110px}.localSeoGrid,.faqGrid{grid-template-columns:1fr}.localSeo .heading h2{font-size:clamp(36px,9.5vw,44px);line-height:1.1;letter-spacing:-1.2px;margin-bottom:18px}.localSeo .heading>p{font-size:17px;line-height:1.6}.localSeoCard{padding:22px}.localSeoCard h3{font-size:22px}.localSeoCard p{font-size:16px;line-height:1.65}.faq{padding:18px}.localCta{flex-direction:column;align-items:flex-start}}
          '''
          html = re.sub(r'</style>', css + '\n</style>', html, count=1, flags=re.I)

          section = r'''
          <section class="localSeo" id="local-services">
            <div class="container">
              <div class="heading">
                <div class="eyebrow">Delhi Local Appliance Service</div>
                <h2>AC Repair, Fridge Repair & Washing Machine Service in Delhi</h2>
                <p>Sameer Cooling Care provides home-appliance repair, service, installation and maintenance for customers in Delhi and nearby areas.</p>
              </div>
              <div class="localSeoGrid">
                <article class="localSeoCard">
                  <h3>AC Repair in Delhi</h3>
                  <p>AC repair and servicing for cooling problems, AC gas filling, cooling coil replacement, installation and routine maintenance in Delhi.</p>
                </article>
                <article class="localSeoCard">
                  <h3>Fridge Repair in Delhi</h3>
                  <p>Refrigerator repair and service for common cooling and performance problems, with troubleshooting and maintenance support in Delhi.</p>
                </article>
                <article class="localSeoCard">
                  <h3>Washing Machine Repair in Delhi</h3>
                  <p>Washing machine troubleshooting, repair, installation and maintenance for common everyday appliance issues in Delhi.</p>
                </article>
              </div>
              <div class="heading" style="margin-bottom:24px">
                <div class="eyebrow">Frequently Asked</div>
                <h2 style="font-size:32px">Delhi Service Questions</h2>
              </div>
              <div class="faqGrid">
                <article class="faq"><h3>How can I book a service in Delhi?</h3><p>Call or WhatsApp Sameer Cooling Care and describe the appliance problem to discuss your service requirement.</p></article>
                <article class="faq"><h3>Which appliances do you service in Delhi?</h3><p>Services include AC, refrigerator/fridge and washing machine repair, installation and maintenance.</p></article>
                <article class="faq"><h3>Do you provide AC gas filling in Delhi?</h3><p>Yes. AC gas filling is available as part of the AC service offering when required after checking the appliance.</p></article>
                <article class="faq"><h3>Do you replace AC cooling coils in Delhi?</h3><p>Cooling coil replacement is available for AC units where replacement is the appropriate repair solution.</p></article>
              </div>
              <div class="localCta">
                <div><strong>Need appliance service in Delhi?</strong><p>Get in touch and tell us what needs attention.</p></div>
                <a class="btn primary" href="tel:9870657543">📞 Call for Service</a>
              </div>
            </div>
          </section>
          '''

          if 'id="local-services"' not in html:
              html = re.sub(r'</main>', section + '\n</main>', html, count=1, flags=re.I)
          else:
              html = re.sub(r'<section class="localSeo" id="local-services">.*?</section>', section, html, count=1, flags=re.I|re.S)

          faq_schema = {
              "@context": "https://schema.org",
              "@type": "FAQPage",
              "mainEntity": [
                  {"@type":"Question","name":"How can I book a service in Delhi?","acceptedAnswer":{"@type":"Answer","text":"Call or WhatsApp Sameer Cooling Care and describe the appliance problem to discuss your service requirement."}},
                  {"@type":"Question","name":"Which appliances do you service in Delhi?","acceptedAnswer":{"@type":"Answer","text":"Services include AC, refrigerator/fridge and washing machine repair, installation and maintenance."}},
                  {"@type":"Question","name":"Do you provide AC gas filling in Delhi?","acceptedAnswer":{"@type":"Answer","text":"Yes. AC gas filling is available as part of the AC service offering when required after checking the appliance."}},
                  {"@type":"Question","name":"Do you replace AC cooling coils in Delhi?","acceptedAnswer":{"@type":"Answer","text":"Cooling coil replacement is available for AC units where replacement is the appropriate repair solution."}}
              ]
          }
          block = '<script type="application/ld+json">' + json.dumps(faq_schema, ensure_ascii=False, separators=(",", ":")) + '</script>'
          html = re.sub(r'<script type="application/ld\+json">\{"@context":"https://schema.org","@type":"FAQPage".*?</script>', '', html, count=1, flags=re.I|re.S)
          html = re.sub(r'</head>', block + '\n</head>', html, count=1, flags=re.I)

          path.write_text(html, encoding="utf-8")
          print("Delhi-primary local SEO service section and FAQ content added")
          PY

      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
          name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
