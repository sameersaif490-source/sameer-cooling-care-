name: Deploy website to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Optimize embedded gallery images
        run: |
          python3 - <<'PY'
          import base64
          import hashlib
          import re
          from pathlib import Path

          path = Path("index.html")
          html = path.read_text(encoding="utf-8")
          out = Path("images")
          out.mkdir(exist_ok=True)
          seen = {}
          counter = [0]

          pattern = re.compile(r'data:image/(jpeg|jpg|png|webp);base64,([A-Za-z0-9+/=]+)')

          def replace(match):
              ext, encoded = match.groups()
              raw = base64.b64decode(encoded)
              digest = hashlib.sha256(raw).hexdigest()[:16]
              if digest not in seen:
                  counter[0] += 1
                  suffix = "jpg" if ext in ("jpeg", "jpg") else ext
                  filename = f"gallery-{counter[0]}.{suffix}"
                  (out / filename).write_bytes(raw)
                  seen[digest] = filename
              return seen[digest]

          html = pattern.sub(replace, html)
          html = re.sub(r'<img(?![^>]*\bloading=)([^>]*?)>', r'<img\1 loading="lazy" decoding="async">', html, flags=re.I)
          path.write_text(html, encoding="utf-8")
          print(f"Extracted {len(seen)} unique embedded images; HTML size is now {path.stat().st_size} bytes")
          PY

      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
          name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
